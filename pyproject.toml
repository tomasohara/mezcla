# pyproject.toml
#
# Build, package, distribution, and developer-tool configuration for Mezcla.
#
# This project is built and published with Flit / flit_core. Package metadata,
# runtime dependencies, supported Python versions, PyPI metadata, and installed
# command-line entry points are defined using the standard PEP 621 [project]
# table below.
#
# Do not add legacy setup.py metadata, [tool.poetry] package metadata, or
# [tool.flit.metadata] here. Those configurations conflict with, or are ignored
# by, the Flit build/publish workflow used for this project.
#
# Release procedure:
#   1. Update the version in [project].
#   2. Build with: flit build
#   3. Inspect and test the artifacts in dist/ in a clean virtual environment.
#   4. Publish with: FLIT_USERNAME="__token__" FLIT_PASSWORD="$token" flit publish
#   5. Create the matching annotated Git tag, e.g. v1.4.1.1.
#
# Runtime dependencies must be listed in [project.dependencies]. Merely having a
# package importable in a development environment does not cause pip users to
# receive it when they install Mezcla from PyPI.
#
# note: specification revised via GPT-5.6-Terra
#

[build-system]
## OLD:
## requires = ["flit_core >=3.11,<5"]
## build-backend = "flit_core.buildapi"
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mezcla"
version = "1.4.1.1"
description = "Miscellaneous Python scripts developed over the course of several independent consulting projects. Mezcla is Spanish for mixture."
readme = { file = "README.txt", content-type = "text/plain" }
requires-python = ">=3.9"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Tomás O'Hara", email = "tomasohara@gmail.com" },
]
dependencies = [
    "asttokens",
    "executing",
    "requests",
    "six",
    "typing_extensions>=4.6.0",
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/tomasohara/mezcla"
Repository = "https://github.com/tomasohara/mezcla"

[tool.mypy]
disable_error_code = [
    "import-untyped",
    "import-not-found",
]
exclude = [
    "(examples|tests|adhoc|temp)/",
    "__init__",
]

